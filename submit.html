<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rabbits & Wolves · 캡처·해석 제출</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><div class="brand-mark">📝</div><div><small>통합과학 2 · 생태계 상호작용</small><h1>Rabbits <b>&</b> Wolves</h1></div></div>
  <nav class="nav"><a href="index.html">모의실험</a><a href="game.html">생존 게임</a><a class="active" href="submit.html">캡처·해석 제출</a></nav>
</div></header>
<main class="page">
  <section class="panel submit-box">
    <div class="section-title"><div><div class="kicker">SUBMISSION</div><h2>캡처와 해석 제출</h2></div></div>
    <div class="form-grid" style="margin-top:12px">
      <div>
        <div class="field"><label>반 / 학번</label><input id="studentId" placeholder="예: 2-3 15"></div>
        <div class="field" style="margin-top:10px"><label>이름</label><input id="studentName" placeholder="이름"></div>
        <div class="field" style="margin-top:10px"><label>제출 활동</label><select id="activity"><option value="모의실험">모의실험</option><option value="생존 게임">생존 게임</option></select></div>
        <div class="field" style="margin-top:10px"><label>관찰 및 해석</label><textarea id="interpretation" placeholder="그래프와 생태 피라미드에서 관찰한 변화와 그 이유를 자신의 언어로 작성하세요."></textarea></div>
        <div class="btn-row" style="margin-top:10px">
          <button id="loadSim" class="btn-secondary">모의실험 캡처 불러오기</button>
          <button id="loadGame" class="btn-secondary">게임 캡처 불러오기</button>
        </div>
        <div class="field" style="margin-top:10px"><label>또는 이미지 직접 업로드</label><input id="fileInput" type="file" accept="image/*"></div>
        <div class="btn-row" style="margin-top:12px"><button id="submitBtn" class="btn-primary">제출</button></div>
        <div id="submitStatus" class="notice" style="margin-top:10px;background:#f4f7f3;border-color:#d6dfd4">아직 제출하지 않았습니다.</div>
      </div>
      <div>
        <div class="capture-preview" id="preview"><span style="color:var(--muted)">저장된 캡처 또는 업로드한 이미지를 불러오세요.</span></div>
      </div>
    </div>
  </section>
  <iframe name="submitFrame" id="submitFrame" style="display:none"></iframe>
  <form id="hiddenForm" method="POST" target="submitFrame" style="display:none">
    <input name="studentId"><input name="studentName"><input name="activity"><input name="interpretation"><input name="imageData"><input name="score">
  </form>
</main>
<script>
const WEB_APP_URL = "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";
let imageData="";
const $=id=>document.getElementById(id);
function show(data){
  imageData=data||"";
  preview.innerHTML=imageData?`<img src="${imageData}" alt="제출할 캡처 이미지">`:'<span style="color:var(--muted)">캡처가 없습니다.</span>';
}
loadSim.onclick=()=>{activity.value='모의실험';show(localStorage.getItem('capture_sim'));};
loadGame.onclick=()=>{activity.value='생존 게임';show(localStorage.getItem('capture_game'));};
fileInput.onchange=()=>{
  const f=fileInput.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>show(r.result);r.readAsDataURL(f);
};
submitBtn.onclick=()=>{
  if(!studentId.value.trim()||!studentName.value.trim()||!interpretation.value.trim()){submitStatus.textContent='반/학번, 이름, 관찰 및 해석을 모두 입력하세요.';return;}
  if(!imageData){submitStatus.textContent='제출할 캡처 이미지를 불러오거나 업로드하세요.';return;}
  if(WEB_APP_URL.startsWith('PASTE_')){submitStatus.textContent='제출 기능이 아직 연결되지 않았습니다. 교사에게 알려 주세요.';return;}
  const f=hiddenForm;f.action=WEB_APP_URL;
  f.studentId.value=studentId.value.trim();f.studentName.value=studentName.value.trim();f.activity.value=activity.value;
  f.interpretation.value=interpretation.value.trim();f.imageData.value=imageData;f.score.value=localStorage.getItem('rw_game_score')||'';
  f.submit();submitStatus.textContent='제출 요청을 보냈습니다. 교사용 시트에서 기록을 확인하세요.';
};
</script>
</body></html>
